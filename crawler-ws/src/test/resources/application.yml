# Test configuration, replaces the Maven-filtered main application.yml
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
  application:
    name: crawler-ws
  cloud:
    zookeeper:
      enabled: false
  boot:
    admin:
      client:
        enabled: false
management:
  endpoints:
    web:
      exposure:
        # Expose everything, as a deployment might, to check the security rules still apply
        include: "*"
crawler:
  crawl:
    namespace: crawler
    server:
      zk: localhost:1
      retryAttempts: 1
      retryDelayMs: 10
    threadCount: 1
  registry:
    ws:
      url: http://localhost:1
