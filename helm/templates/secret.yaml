{{- if .Values.rabbit.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rabbit.credentialsSecret }}
type: Opaque
stringData:
  username: {{ required "rabbit.username is required with rabbit.createSecret" .Values.rabbit.username | quote }}
  password: {{ required "rabbit.password is required with rabbit.createSecret" .Values.rabbit.password | quote }}
{{- end }}
{{- if and .Values.rabbit.createSecret .Values.registry.createSecret }}
---
{{- end }}
{{- if .Values.registry.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.credentialsSecret }}
type: Opaque
stringData:
  username: {{ required "registry.username is required with registry.createSecret" .Values.registry.username | quote }}
  password: {{ required "registry.password is required with registry.createSecret" .Values.registry.password | quote }}
{{- end }}
